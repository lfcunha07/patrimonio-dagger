<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Valuation do Seringal + Terra por Fazenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --canopy:#1f4034; --canopy2:#2e5a45; --latex:#f6f3ea; --amber:#b9791b; --amber-l:#d99a2b;
    --slate:#2b3440; --muted:#78857c; --clay:#b5432b; --card:#ffffff; --line:#e7e2d5; --leaf:#3f7d5a;
    --u-ser:#2a78d6; --u-cana:#eb6834; --u-past:#1baf7a; --u-pres:#eda100; --u-silv:#e87ba4; --u-benf:#008300;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--latex);color:var(--slate);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px;}
  h1,h2,.num{font-family:"Space Grotesk","Inter",sans-serif;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;}
  .btn{border:1px solid var(--line);background:#fbf9f3;border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:"Inter";color:var(--slate);transition:.15s;}
  .btn:hover{border-color:var(--amber);}
  .btn.on{background:var(--canopy);color:#fff;border-color:var(--canopy);}
  input[type=range]{width:100%;accent-color:var(--canopy);}
  label.lab{font-size:11px;font-weight:600;color:var(--muted);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;}
  td{padding:6px 10px;}
  .neg{color:var(--clay);}
  .pos{color:var(--leaf);}
  .tick{font-size:10px;fill:var(--muted);font-family:"Inter";}
  .axlabel{font-size:10px;fill:var(--muted);}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
  a{color:var(--canopy2);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,Fragment} = React;

// ---------- ATIVO BIOLÓGICO (seringueira) — 7 fazendas de produção ----------
// kgArv = produtividade medida na safra 2024-25 (kg de coágulo úmido/árvore).
// blocos = [safra, nº árvores] na safra 2025-26 (idade dos talhões).
const FARMS=[
 {id:"SG",nome:"São Geraldo",     kgArv:7.020, cor:"#2e5a45", blocos:[[8,979],[10,11141],[11,40977],[12,17133],[13,25140]]},
 {id:"SL",nome:"São Luiz",        kgArv:8.528, cor:"#3f7d5a", blocos:[[6,10096],[12,5599],[13,22218]]},
 {id:"SA",nome:"Santo Antônio",   kgArv:5.449, cor:"#6b8e23", blocos:[[2,16991],[10,4074],[13,4748],[14,5054],[14.5,21473]]},
 {id:"SR",nome:"Santos Reis",     kgArv:4.835, cor:"#a8801f", blocos:[[9,28960]]},
 {id:"TL",nome:"Tolantino",       kgArv:6.915, cor:"#457b9d", blocos:[[6,6652],[8,17012]]},
 {id:"BL",nome:"Bálsamo",         kgArv:5.608, cor:"#8a5a2b", blocos:[[5,3406],[6,5634]]},
 {id:"SP",nome:"Santa Paula",     kgArv:3.983, cor:"#b9791b", blocos:[[6,4923],[14.5,7858]]},
];
const PRICE_PRESETS=[["Conservador",5.00],["Base 25-26",5.53],["Bom 24-25",6.93],["Pico",8.30]];
const DISC_PRESETS=[["Potencial de produção",0],["Longo prazo",0.04],["Investidor",0.0875]];

// ---------- TERRA — área por matrícula × classe de uso (ha), com município real ----------
// Município confirmado nas plantas + cadastro. M 20486 reclassificado (topógrafo marcou
// eucalipto, mas é seringueira jovem). Rótulos incluem a fazenda (de-para fechado).
const MATRIC=[
 {nome:"São Geraldo / São Luiz",  mat:"15586",        mun:"Riolândia",      ser:266.97,cana:0,     past:202.38,silv:0,pres:173.35,benf:8.38, tot:651.08},
 {nome:"Santos Reis / Tolantino", mat:"15587·88·787", mun:"Riolândia",      ser:142.59,cana:139.94,past:0,     silv:0,pres:50.04, benf:15.05,tot:347.63},
 {nome:"Santo Antônio",           mat:"20042·15658",  mun:"Cardoso",        ser:118.47,cana:0.70,  past:163.27,silv:0,pres:40.65, benf:7.05, tot:330.13},
 {nome:"Bálsamo",                 mat:"15594-98",     mun:"Riolândia",      ser:21.35, cana:117.71,past:5.55,  silv:0,pres:25.16, benf:6.55, tot:176.32},
 {nome:"Santa Paula (Prainha)",   mat:"20202·20203",  mun:"Mira Estrela",   ser:27.88, cana:0,     past:16.64, silv:0,pres:5.63,  benf:2.54, tot:52.70},
 {nome:"Hermínio Caldeira",       mat:"20218 +conj.", mun:"Mira Estrela",   ser:0,     cana:0,     past:243.50,silv:0,pres:42.77, benf:2.27, tot:288.53},
 {nome:"N. S. Aparecida",         mat:"20187",        mun:"Mira Estrela",   ser:0,     cana:0,     past:18.39, silv:0,pres:9.85,  benf:0.17, tot:28.42},
 {nome:"Sítio Frota",             mat:"20486",        mun:"Cardoso",        ser:21.40, cana:0,     past:0,     silv:0,pres:0.02,  benf:0.00, tot:21.43},
 {nome:"Sítio Felicidade",        mat:"27341",        mun:"S. J. Rio Preto",ser:0,     cana:0,     past:17.50, silv:0,pres:0.41,  benf:0.03, tot:17.93},
 {nome:"Barra L",                 mat:"24027",        mun:"Ap. Taboado-MS", ser:0,     cana:590.61,past:14.22, silv:0,pres:282.26,benf:42.80,tot:929.88},
];
const USES=[
 ["ser","Seringueira","var(--u-ser)"],["cana","Cana","var(--u-cana)"],["past","Pastagem","var(--u-past)"],
 ["pres","Preservação (APP/RL)","var(--u-pres)"],["silv","Silvicultura","var(--u-silv)"],["benf","Benfeitorias/estradas","var(--u-benf)"],
];
// VTN — Valor da Terra Nua, Receita Federal (SIPT), exercício 2026 (R$/ha), por município.
const VTN={
 "Riolândia":      {lavoura:45636.20,pastagem:22589.92,silvicultura:20536.29,preservacao:16429.03},
 "Cardoso":        {lavoura:49521.43,pastagem:31693.71,silvicultura:26741.27,preservacao:21789.42},
 "Mira Estrela":   {lavoura:38217.51,pastagem:27394.35,silvicultura:21209.69,preservacao:24302.02},
 "S. J. Rio Preto":{lavoura:33149.93,pastagem:25284.44,silvicultura:20796.92,preservacao:15266.92},
 "Ap. Taboado-MS": {lavoura:13656.00,pastagem:6624.00, silvicultura:6019.00, preservacao:3851.00},
};
const rhaFor=(mun,mkt,serBase)=>{const v=VTN[mun]||VTN["Mira Estrela"];return{
  ser:v[serBase]*mkt, cana:v.lavoura*mkt, past:v.pastagem*mkt,
  silv:v.silvicultura*mkt, pres:v.preservacao*mkt, benf:v.pastagem*mkt};};
const landVal=(d,mkt,serBase)=>{const r=rhaFor(d.mun,mkt,serBase);return d.ser*r.ser+d.cana*r.cana+d.past*r.past+d.silv*r.silv+d.pres*r.pres+d.benf*r.benf;};

const brl=n=>(isFinite(n)?n:0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const brl2=n=>(isFinite(n)?n:0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:2});
const N=n=>(isFinite(n)?n:0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const N1=n=>(isFinite(n)?n:0).toLocaleString("pt-BR",{maximumFractionDigits:1});
const mi=n=>"R$ "+(n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2})+" mi";
const matur=s=> s<=1?0:Math.min(1,s/8);

function blocoNPV(safra,P,unit,d,L,ramp){
  const rem=L-safra; if(rem<=0) return 0;
  let v=0, anos=Math.round(rem);
  for(let k=1;k<=anos;k++){ const f=ramp?matur(safra+k):1; v+=Math.max(0,P*f*unit)/Math.pow(1+d,k); }
  return v;
}

// ---------- GRÁFICO: receita x custo x margem por fazenda ----------
function FarmChart({data}){
  const W=720,H=300,pl=46,pr=12,pt=14,pb=58;
  const pw=W-pl-pr, ph=H-pt-pb;
  const vals=data.flatMap(d=>[d.Receita,d.Custo,d.Margem]);
  const vmax=Math.max(1,...vals), vmin=Math.min(0,...vals);
  const y=v=> pt+ph-((v-vmin)/(vmax-vmin))*ph;
  const gw=pw/data.length, bw=gw*0.24;
  const series=[["Receita","#2e5a45"],["Custo","#b9791b"],["Margem","#457b9d"]];
  const ticks=4; const tk=[...Array(ticks+1)].map((_,i)=>vmin+(vmax-vmin)*i/ticks);
  return(
   <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
    {tk.map((t,i)=>(<g key={i}><line x1={pl} x2={W-pr} y1={y(t)} y2={y(t)} stroke="#efeade"/><text className="tick" x={pl-6} y={y(t)+3} textAnchor="end">{t.toFixed(0)}</text></g>))}
    <line x1={pl} x2={W-pr} y1={y(0)} y2={y(0)} stroke="#c9c2b0"/>
    {data.map((d,i)=>{
      const gx=pl+i*gw;
      return(<g key={d.id}>
        {series.map(([key,c],j)=>{
          const v=d[key], yy=y(v), y0=y(0), bx=gx+gw*0.14+j*bw;
          const h=Math.abs(yy-y0);
          return <rect key={key} x={bx} y={Math.min(yy,y0)} width={bw} height={h} rx="2" fill={c}><title>{`${d.nome} · ${key}: ${brl2(v)}`}</title></rect>;
        })}
        <text className="tick" x={gx+gw/2} y={H-pb+16} textAnchor="middle" transform={`rotate(-14 ${gx+gw/2} ${H-pb+16})`}>{d.nome}</text>
      </g>);
    })}
    {series.map(([key,c],j)=>(<g key={key}><rect x={pl+j*118} y={H-20} width="11" height="11" rx="2" fill={c}/><text className="tick" x={pl+j*118+16} y={H-11}>{key}</text></g>))}
   </svg>
  );
}

// ---------- GRÁFICO: valor da árvore por idade ----------
function LifeChart({data}){
  const W=720,H=300,pl=52,pr=48,pt=16,pb=40;
  const pw=W-pl-pr, ph=H-pt-pb;
  const npvs=data.map(d=>d.npv), bios=data.map(d=>d.bio);
  const nmax=Math.max(1,...npvs), nmin=Math.min(0,...npvs);
  const bmax=Math.max(1,...bios);
  const x=i=> pl+(i+0.5)*(pw/data.length);
  const yN=v=> pt+ph-((v-nmin)/(nmax-nmin))*ph;
  const yB=v=> pt+ph-(v/bmax)*ph;
  const bw=(pw/data.length)*0.64;
  const line=data.map((d,i)=>`${x(i)},${yB(d.bio)}`).join(" ");
  const tk=[...Array(5)].map((_,i)=>nmin+(nmax-nmin)*i/4);
  const peak=data.reduce((a,b)=>b.npv>a.npv?b:a,data[0]); const pi=data.indexOf(peak);
  return(
   <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
    {tk.map((t,i)=>(<g key={i}><line x1={pl} x2={W-pr} y1={yN(t)} y2={yN(t)} stroke="#efeade"/><text className="tick" x={pl-6} y={yN(t)+3} textAnchor="end">R${t.toFixed(0)}</text></g>))}
    <line x1={pl} x2={W-pr} y1={yN(0)} y2={yN(0)} stroke="#c9c2b0"/>
    {data.map((d,i)=>{
      const y0=yN(0),yy=yN(d.npv);
      return <rect key={i} x={x(i)-bw/2} y={Math.min(yy,y0)} width={bw} height={Math.abs(yy-y0)} rx="1.5" fill={i===pi?"#1f4034":(d.npv>=0?"#2e5a45":"#b5432b")} opacity={i===pi?1:0.82}><title>{`${d.safra}ª safra · valor do ativo ${brl2(d.npv)}/árvore (VP de todo o lucro futuro restante)`}</title></rect>;
    })}
    {peak.npv>0 && <g><line x1={x(pi)} x2={x(pi)} y1={pt} y2={yN(peak.npv)} stroke="#1f4034" strokeDasharray="2 3" opacity=".5"/>
      <text x={x(pi)} y={pt+9} textAnchor="middle" style={{fontSize:10,fill:"#1f4034",fontWeight:700}}>pico {peak.safra}ª · {brl2(peak.npv)}</text></g>}
    <polyline points={line} fill="none" stroke="#d99a2b" strokeWidth="2.4"/>
    {data.filter((_,i)=>i%2===0||i===data.length-1).map((d)=>{const i=data.indexOf(d);return <text key={i} className="tick" x={x(i)} y={H-pb+16} textAnchor="middle">{d.safra}</text>;})}
    <text className="axlabel" x={(pl+W-pr)/2} y={H-6} textAnchor="middle">idade da árvore (safra atual)</text>
    {[...Array(4)].map((_,i)=>{const v=bmax*(i+1)/4;return <text key={i} className="tick" x={W-pr+6} y={yB(v)+3}>{v.toFixed(0)}kg</text>;})}
   </svg>
  );
}

// ---------- GRÁFICO: uso do solo por matrícula (barras empilhadas) ----------
function LandChart({data,mkt,serBase}){
  const W=760,rowH=30,g=12,pl=200,pr=120,pt=8;
  const H=pt+data.length*(rowH+g)+8;
  const maxTot=Math.max(...data.map(d=>d.tot));
  const sx=v=> (v/maxTot)*(W-pl-pr);
  const keys=USES.map(u=>u[0]);
  const colorOf={ser:"var(--u-ser)",cana:"var(--u-cana)",past:"var(--u-past)",pres:"var(--u-pres)",silv:"var(--u-silv)",benf:"var(--u-benf)"};
  return(
   <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
    {data.map((d,i)=>{
      const y=pt+i*(rowH+g); let cx=pl; const r=rhaFor(d.mun,mkt,serBase);
      return(<g key={d.nome}>
        <text className="tick" x={pl-8} y={y+rowH/2+3} textAnchor="end" style={{fontSize:10.5,fill:"var(--slate)"}}>{d.nome}</text>
        {keys.map(k=>{
          const w=sx(d[k]); if(w<=0) return null;
          const seg=<g key={k}>
            <rect x={cx} y={y} width={Math.max(0,w-2)} height={rowH} rx="2" fill={colorOf[k]}>
              <title>{`${d.nome} · ${USES.find(u=>u[0]===k)[1]}: ${N1(d[k])} ha · ${brl(d[k]*r[k])}`}</title></rect>
            {w>34 && <text x={cx+w/2-1} y={y+rowH/2+3} textAnchor="middle" style={{fontSize:9.5,fill:"#fff",fontWeight:600}}>{N1(d[k])}</text>}
          </g>;
          cx+=w; return seg;
        })}
        <text x={cx+6} y={y+rowH/2+3} style={{fontSize:10,fill:"var(--muted)",fontWeight:600}}>{N1(d.tot)} ha · {mi(landVal(d,mkt,serBase))}</text>
      </g>);
    })}
   </svg>
  );
}

function App(){
  const [price,setPrice]=useState(5.53);
  const [drc,setDrc]=useState(0.60);
  const [pctSer,setPctSer]=useState(0.50);     // % do seringueiro (provisório — a usina define)
  const [pctManut,setPctManut]=useState(0.10); // manutenção ~10% (gerente)
  const [disc,setDisc]=useState(0.04);
  const [life,setLife]=useState(30);
  const [ramp,setRamp]=useState(true);
  const [mkt,setMkt]=useState(1.0);            // ajuste de mercado sobre o VTN
  const [benf,setBenf]=useState(0);            // benfeitorias — representado, a decidir
  const [serBase,setSerBase]=useState("silvicultura"); // base do chão da seringueira

  const custoFrac=Math.min(0.99,pctSer+pctManut);   // custo como fração da produção
  const unit=drc*price*(1-custoFrac);               // margem R$/kg de coágulo

  const D=useMemo(()=>{
    let tT=0,tR=0,tC=0,tV=0,tKg=0;
    const farms=FARMS.map(f=>{
      const trees=f.blocos.reduce((a,[,n])=>a+n,0), P=f.kgArv;
      const rec=P*drc*price, cst=rec*custoFrac, mrg=rec-cst;
      let npv=0; const blocos=f.blocos.map(([s,n])=>{const v=blocoNPV(s,P,unit,disc,life,ramp);npv+=v*n;return{s,n,rest:Math.max(0,life-s),v};});
      tT+=trees;tR+=rec*trees;tC+=cst*trees;tV+=npv;tKg+=P*trees;
      return{...f,trees,P,rec,cst,mrg,npv,npvArv:npv/trees,blocos};
    }).sort((a,b)=>b.npvArv-a.npvArv);
    return{farms,tT,tR,tC,tM:tR-tC,tV,kg:tKg/tT};
  },[price,drc,custoFrac,unit,disc,life,ramp]);

  const land=useMemo(()=>{
    let tot=0,ha=0; const perUse={ser:0,cana:0,past:0,silv:0,pres:0,benf:0};
    MATRIC.forEach(d=>{tot+=landVal(d,mkt,serBase);ha+=d.tot;USES.forEach(([k])=>perUse[k]+=d[k]);});
    return{tot,ha,perUse};
  },[mkt,serBase]);
  const asset=D.tV+land.tot+benf;

  const Pavg=D.kg;
  const life$=useMemo(()=>{const a=[];for(let s=1;s<=life;s++)a.push({safra:s,npv:blocoNPV(s,Pavg,unit,disc,life,ramp),bio:Pavg*matur(s)});return a;},[Pavg,unit,disc,life,ramp]);
  const farmBar=D.farms.map(f=>({id:f.id,nome:f.nome,Receita:+f.rec.toFixed(2),Custo:+f.cst.toFixed(2),Margem:+f.mrg.toFixed(2)}));

  const KPI=[
    {t:"Valor do imóvel",v:mi(asset),s:"terra + seringal + benfeitorias",hi:true},
    {t:"Terra nua",v:mi(land.tot),s:N1(land.ha)+" ha · 5 municípios"},
    {t:"Ativo biológico",v:mi(D.tV),s:N(D.tT)+" árvores em produção"},
    {t:"Benfeitorias",v:benf>0?mi(benf):"a definir",s:"decidir por último"},
    {t:"Margem anual",v:brl(D.tM),s:(100*(1-custoFrac)).toFixed(0)+"% da receita",neg:D.tM<0},
  ];

  return(
   <div className="wrap">
    <div style={{display:"flex",alignItems:"center",gap:12}}>
      <div style={{width:40,height:40,borderRadius:12,background:"var(--canopy)",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d99a2b" strokeWidth="1.8"><path d="M12 22V9M12 9c-3 0-5-2-5-5 3 0 5 2 5 5zM12 9c3 0 5-2 5-5-3 0-5 2-5 5z"/><path d="M8 22h8"/></svg>
      </div>
      <div>
        <div className="eyebrow">Heveicultura · valuation de imóvel rural</div>
        <h1 style={{margin:"2px 0 0",fontSize:26,letterSpacing:"-.02em",color:"var(--canopy)"}}>Valor do imóvel: terra + seringal</h1>
      </div>
    </div>
    <p style={{color:"var(--muted)",fontSize:13,marginTop:8,maxWidth:700}}>
      Duas camadas somadas: a <b>terra nua</b> (área × R$/ha por classe de uso e por município) e o <b>ativo biológico</b> (VP do que cada seringueira ainda vai render). Produtividade, áreas, matrículas e municípios vêm dos seus documentos; o custo usa o modelo de <b>% da produção</b> (o seringueiro é definido pela usina) e é ajustável.
    </p>

    {/* aviso */}
    <div style={{marginTop:16,display:"flex",gap:8,alignItems:"flex-start",border:"1px solid #e6cf8f",background:"#fbf3dd",borderRadius:10,padding:"10px 12px",fontSize:13,color:"#7a5a12"}}>
      <span style={{fontWeight:700}}>⚠</span>
      <span>Ainda <b>provisórios</b>: o <b>% do seringueiro</b> (a usina define — base a confirmar) e o <b>ajuste de mercado</b> da terra. As <b>benfeitorias</b> estão representadas mas em branco (a decidir por último). Todo o resto sai dos documentos.</span>
    </div>

    {/* KPIs */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginTop:16}} className="grid5">
      {KPI.map((k,i)=>(
        <div key={i} className="card" style={{padding:"12px 13px",background:k.hi?"#eef4ee":"#fff",borderColor:k.hi?"#bcd6c4":"var(--line)"}}>
          <div style={{fontSize:10,letterSpacing:".05em",textTransform:"uppercase",color:"var(--muted)",fontWeight:600}}>{k.t}</div>
          <div className="num" style={{fontSize:18,fontWeight:700,marginTop:3,color:k.neg?"var(--clay)":k.hi?"var(--canopy)":"var(--slate)"}}>{k.v}</div>
          <div style={{fontSize:11,color:"var(--muted)"}}>{k.s}</div>
        </div>
      ))}
    </div>

    {/* controles */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:16}} className="grid2">
      <div className="card" style={{padding:16}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Mercado da borracha</div>
        <label className="lab">Preço da borracha (R$/kg seco)</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,margin:"6px 0"}}>
          {PRICE_PRESETS.map(([l,v])=><button key={l} className={"btn"+(Math.abs(price-v)<.001?" on":"")} onClick={()=>setPrice(v)}>{l} · {v.toFixed(2)}</button>)}
        </div>
        <input type="range" min="4" max="9" step="0.05" value={price} onChange={e=>setPrice(+e.target.value)}/>
        <div style={{textAlign:"right",fontWeight:600,fontSize:14}}>{brl2(price)} /kg seco</div>
        <label className="lab" style={{display:"block",marginTop:10}}>Teor de borracha seca — DRC · {(drc*100).toFixed(0)}%</label>
        <input type="range" min="0.50" max="0.65" step="0.005" value={drc} onChange={e=>setDrc(+e.target.value)}/>
        <div style={{fontSize:11,color:"var(--muted)"}}>Padrão de mercado 53%. Sua fazenda ~60% (prêmio de qualidade).</div>
      </div>

      <div className="card" style={{padding:16}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>Custo — % da produção</div>
        <label className="lab">% do seringueiro (a usina define) · {(pctSer*100).toFixed(0)}%</label>
        <input type="range" min="0" max="0.7" step="0.01" value={pctSer} onChange={e=>setPctSer(+e.target.value)}/>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:6}}>Provisório — base a confirmar com a usina/Gilson.</div>
        <label className="lab">Manutenção · {(pctManut*100).toFixed(0)}%</label>
        <input type="range" min="0" max="0.3" step="0.01" value={pctManut} onChange={e=>setPctManut(+e.target.value)}/>
        <div style={{fontSize:11,color:"var(--muted)"}}>Tratos/adubação/estrada (~10%, gerente).</div>
        <div style={{marginTop:8,padding:"7px 10px",borderRadius:8,background:"#f4f1e8",fontSize:12}}>
          Custo total = <b>{(custoFrac*100).toFixed(0)}%</b> da produção · equivale a <b>{brl2(drc*price*custoFrac)}</b>/kg de coágulo · margem <b>{brl2(unit)}</b>/kg.
        </div>
        <div style={{marginTop:8}}>
          <label className="lab">Desconto — lente do valor · {(disc*100).toFixed(2)}% a.a.</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,margin:"5px 0"}}>
            {DISC_PRESETS.map(([l,v])=><button key={l} className={"btn"+(Math.abs(disc-v)<.001?" on":"")} onClick={()=>setDisc(v)}>{l} · {(v*100).toFixed(0)}%</button>)}
          </div>
          <input type="range" min="0" max="0.15" step="0.0025" value={disc} onChange={e=>setDisc(+e.target.value)}/>
          <div style={{fontSize:11,color:"var(--muted)"}}>0% = árvore nova sempre vale mais (potencial de produção). Quanto maior a taxa, mais o valor migra para as árvores já em produção.</div>
        </div>
        <div style={{marginTop:8}}>
          <label className="lab">Vida útil · {life}ª safra</label>
          <input type="range" min="20" max="40" step="1" value={life} onChange={e=>setLife(+e.target.value)}/>
        </div>
        <label style={{display:"flex",gap:8,alignItems:"center",marginTop:8,fontSize:12,color:"#556",cursor:"pointer"}}>
          <input type="checkbox" checked={ramp} onChange={e=>setRamp(e.target.checked)}/> Curva de maturação (jovens produzem menos) — Embrapa
        </label>
      </div>
    </div>

    {/* controle da terra */}
    <div className="card" style={{padding:16,marginTop:12}}>
      <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8,alignItems:"center",marginBottom:8}}>
        <div style={{fontSize:13,fontWeight:600}}>Valor da terra — VTN 2026 por município (R$/ha)</div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span style={{fontSize:11,color:"var(--muted)"}}>chão da seringueira:</span>
          <button className={"btn"+(serBase==="lavoura"?" on":"")} onClick={()=>setSerBase("lavoura")} style={{padding:"3px 8px"}}>lavoura</button>
          <button className={"btn"+(serBase==="silvicultura"?" on":"")} onClick={()=>setSerBase("silvicultura")} style={{padding:"3px 8px"}}>silvicultura</button>
        </div>
      </div>
      <div style={{overflowX:"auto"}}>
      <table style={{fontSize:12}}>
        <thead><tr><th style={{textAlign:"left"}}>Município</th><th style={{textAlign:"right"}}>Lavoura</th><th style={{textAlign:"right"}}>Pastagem</th><th style={{textAlign:"right"}}>Silvicultura</th><th style={{textAlign:"right"}}>Preservação</th></tr></thead>
        <tbody>{Object.keys(VTN).map(k=>(<tr key={k} style={{borderTop:"1px solid var(--line)"}}><td style={{fontWeight:600}}>{k}</td><td style={{textAlign:"right"}}>{brl(VTN[k].lavoura*mkt)}</td><td style={{textAlign:"right"}}>{brl(VTN[k].pastagem*mkt)}</td><td style={{textAlign:"right"}}>{brl(VTN[k].silvicultura*mkt)}</td><td style={{textAlign:"right"}}>{brl(VTN[k].preservacao*mkt)}</td></tr>))}</tbody>
      </table>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginTop:12}} className="grid2">
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <label className="lab">Ajuste de mercado sobre o VTN · ×{mkt.toFixed(2)}</label>
            <button className={"btn"+(Math.abs(mkt-2)<.001?" on":"")} onClick={()=>setMkt(2.0)} style={{padding:"3px 8px"}}>Mercado ~2×</button>
          </div>
          <input type="range" min="1" max="2.5" step="0.05" value={mkt} onChange={e=>setMkt(+e.target.value)}/>
          <div style={{fontSize:11,color:"var(--muted)"}}>Mercado de seringal na região: <b>R$ 220–250 mil/alqueire</b> ≈ R$ 91–103 mil/ha (~2× o VTN) — mas esse preço já inclui as árvores (seringal formado).</div>
        </div>
        <div>
          <label className="lab">Benfeitorias (R$) — representado, a decidir</label>
          <input type="number" min="0" step="100000" value={benf} onChange={e=>setBenf(+e.target.value||0)} style={{width:"100%",padding:"7px 9px",border:"1px solid var(--line)",borderRadius:8,fontFamily:"Inter",fontSize:13,marginTop:2}}/>
          <div style={{fontSize:11,color:"var(--muted)"}}>Construções, poço, confinamento — definir por último. Entra no "Valor do imóvel".</div>
        </div>
      </div>
    </div>

    {/* USO DO SOLO */}
    <div className="card" style={{padding:16,marginTop:18}}>
      <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:6,alignItems:"baseline"}}>
        <h2 style={{margin:"0 0 2px",fontSize:14}}>Uso do solo e valor da terra por propriedade <span style={{fontWeight:400,color:"var(--muted)"}}>(largura = ha)</span></h2>
        <div style={{fontSize:12,color:"var(--muted)"}}>Total: <b style={{color:"var(--slate)"}}>{N1(land.ha)} ha</b> · <b style={{color:"var(--canopy)"}}>{mi(land.tot)}</b></div>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,margin:"6px 0 10px"}}>
        {USES.map(([k,l,c])=><span key={k} className="chip"><span className="sw" style={{background:c}}></span>{l} · {N1(land.perUse[k])} ha</span>)}
      </div>
      <LandChart data={MATRIC} mkt={mkt} serBase={serBase}/>
      <div style={{overflowX:"auto",marginTop:12}}>
      <table>
        <thead style={{background:"#f4f1e8"}}><tr><th style={{textAlign:"left"}}>Propriedade</th><th style={{textAlign:"left"}}>Matrícula</th><th style={{textAlign:"left"}}>Município</th><th style={{textAlign:"right"}}>Área (ha)</th><th style={{textAlign:"right"}}>Valor da terra</th></tr></thead>
        <tbody>
        {MATRIC.map(d=>(<tr key={d.nome} style={{borderTop:"1px solid var(--line)"}}>
          <td style={{fontSize:12,fontWeight:600}}>{d.nome}</td>
          <td style={{fontSize:12,color:"var(--muted)"}}>M {d.mat}</td>
          <td style={{fontSize:12,color:"var(--muted)"}}>{d.mun}</td>
          <td style={{textAlign:"right"}}>{N1(d.tot)}</td>
          <td style={{textAlign:"right"}}>{brl(landVal(d,mkt,serBase))}</td>
        </tr>))}
        <tr style={{borderTop:"2px solid var(--line)",fontWeight:700}}><td>Total</td><td></td><td></td><td style={{textAlign:"right"}}>{N1(land.ha)}</td><td style={{textAlign:"right"}}>{brl(land.tot)}</td></tr>
        </tbody>
      </table>
      </div>
      <div style={{fontSize:11,color:"var(--muted)",marginTop:6}}>Cada matrícula é precificada pelo VTN do <b>seu</b> município. <b>Cana</b> como <i>lavoura</i>; <b>seringueira</b> na base <i>{serBase}</i> — o prêmio da seringueira vem da <b>árvore deduzida</b> (ativo biológico), não do chão. Pasto/benfeitorias como <i>pastagem</i>; APP+RL como <i>preservação</i>. M 20486 = seringueira jovem (retificar com o topógrafo).</div>
    </div>

    {/* chart farms */}
    <div className="card" style={{padding:16,marginTop:14}}>
      <h2 style={{margin:"0 0 2px",fontSize:14}}>Receita × custo por árvore, por fazenda <span style={{fontWeight:400,color:"var(--muted)"}}>(R$/árvore/ano)</span></h2>
      <FarmChart data={farmBar}/>
      <div style={{fontSize:11,color:"var(--muted)",marginTop:4}}>Custo proporcional à receita ({(custoFrac*100).toFixed(0)}%). São Luiz e São Geraldo puxam a margem; Santa Paula e Santos Reis são os elos fracos.</div>
    </div>

    {/* life curve */}
    <div className="card" style={{padding:16,marginTop:14,borderColor:"#d8cba7",background:"linear-gradient(180deg,#fffdf7,#fbf7ec)"}}>
      <div className="eyebrow" style={{color:"var(--canopy)"}}>Painel de valor da árvore</div>
      <h2 style={{margin:"2px 0 2px",fontSize:14}}>Valor da árvore por idade</h2>
      <p style={{fontSize:12,color:"var(--muted)",margin:"0 0 6px",maxWidth:720}}>Cada barra é o <b>valor do ativo</b>: o VP de <b>todo o lucro que aquela árvore ainda vai trazer</b> da idade atual ao fim da vida (não é valor por ano). Na lente de <b>longo prazo</b> (desconto baixo, padrão), a <b>árvore mais nova vale mais</b> — tem mais safras pela frente. Aumentando o desconto ("investidor"), o valor migra para as árvores <b>já em produção</b>, porque o dinheiro distante pesa menos. Linha âmbar = produção/ano de referência (kg, Embrapa).</p>
      <LifeChart data={life$}/>
    </div>

    {/* tabela seringal */}
    <div className="card" style={{marginTop:14,overflow:"hidden"}}>
      <h2 style={{margin:0,fontSize:14,padding:"16px 16px 4px"}}>Detalhe do seringal por fazenda e talhão</h2>
      <div style={{overflowX:"auto"}}>
      <table>
        <thead style={{background:"#f4f1e8"}}>
          <tr><th style={{textAlign:"left"}}>Fazenda / talhão</th><th style={{textAlign:"right"}}>Árvores</th><th style={{textAlign:"right"}}>kg/árv</th><th style={{textAlign:"right"}}>Receita/árv</th><th style={{textAlign:"right"}}>Margem/árv</th><th style={{textAlign:"right"}}>VPL/árv</th><th style={{textAlign:"right"}}>VPL total</th></tr>
        </thead>
        <tbody>
        {D.farms.map(f=>(
          <Fragment key={f.id}>
            <tr style={{borderTop:"1px solid var(--line)",fontWeight:600}}>
              <td style={{display:"flex",alignItems:"center",gap:8}}><span style={{width:10,height:10,borderRadius:99,background:f.cor}}></span>{f.nome}</td>
              <td style={{textAlign:"right"}}>{N(f.trees)}</td>
              <td style={{textAlign:"right"}}>{N1(f.P)}</td>
              <td style={{textAlign:"right"}}>{brl2(f.rec)}</td>
              <td style={{textAlign:"right"}} className={f.mrg<0?"neg":""}>{brl2(f.mrg)}</td>
              <td style={{textAlign:"right"}} className={f.npvArv<0?"neg":"pos"}>{brl2(f.npvArv)}</td>
              <td style={{textAlign:"right"}} className={f.npv<0?"neg":"pos"}>{brl(f.npv)}</td>
            </tr>
            {f.blocos.map((b,i)=>(
              <tr key={i} style={{color:"var(--muted)",fontSize:12}}>
                <td style={{paddingLeft:30}}>{b.s}ª safra <span style={{color:"#c7c0ae"}}>· restam {N1(b.rest)}</span></td>
                <td style={{textAlign:"right"}}>{N(b.n)}</td>
                <td style={{textAlign:"right"}}>—</td><td style={{textAlign:"right"}}>—</td><td style={{textAlign:"right"}}>—</td>
                <td style={{textAlign:"right"}} className={b.v<0?"neg":""}>{brl2(b.v)}</td>
                <td style={{textAlign:"right"}}>{brl(b.v*b.n)}</td>
              </tr>
            ))}
          </Fragment>
        ))}
        </tbody>
      </table>
      </div>
    </div>

    {/* metodologia + fontes */}
    <div className="card" style={{marginTop:14,padding:16}}>
      <div style={{fontSize:12,fontWeight:700,color:"var(--canopy)",marginBottom:4}}>Como o valuation calcula</div>
      <p style={{fontSize:11,color:"var(--muted)",margin:0,lineHeight:1.6}}>
        <b>Valor do imóvel = terra nua + ativo biológico + benfeitorias.</b> Terra = Σ (área da classe × R$/ha do VTN do município). Ativo biológico = Σ VP das seringueiras. Receita/árvore = kg × DRC × preço seco; <b>custo = % da produção</b> (seringueiro definido pela usina + manutenção). <b>Não inclui</b> ainda: valor das benfeitorias (a decidir), madeira ao fim do ciclo (hoje ~R$ 0 líquido), e a base fechada do custo. Santa Helena foi excluída (dupla contagem, já dentro do Hermínio Caldeira).
      </p>
      <div style={{fontSize:11,color:"var(--muted)",marginTop:10,lineHeight:1.7,borderTop:"1px solid var(--line)",paddingTop:10}}>
        <b>Fontes.</b> VTN por município (R$/ha): <a href="https://www.gov.br/receitafederal/pt-br/centrais-de-conteudo/publicacoes/documentos-tecnicos/vtn" target="_blank">Receita Federal — SIPT/VTN</a>, exercício 2026 (Riolândia, Cardoso, Mira Estrela, São José do Rio Preto-SP e Aparecida do Taboado-MS). Preço de mercado, custo (seringueiro/manutenção) e madeira: informado pelo gerente/Gilson (ago/2026). Ciclo de vida e maturação: <a href="https://www.embrapa.br/" target="_blank">Embrapa</a>. Áreas, matrículas, municípios e de-para: plantas georreferenciadas + cadastro consolidado. Produção e idade dos talhões: apontamentos das safras 2024-25 e 2025-26.
      </div>
    </div>

    <p style={{fontSize:10,color:"#a9a293",marginTop:14,textAlign:"center"}}>Protótipo de valuation — não é avaliação formal (NBR 14.653). % do seringueiro e ajuste de mercado provisórios; benfeitorias a definir.</p>
   </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<style>
@media(max-width:760px){ .grid2{grid-template-columns:1fr!important;} .grid5{grid-template-columns:repeat(2,1fr)!important;} .grid3{grid-template-columns:1fr!important;} }
</style>
</body>
</html>

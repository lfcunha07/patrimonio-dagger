<title>Acesso restrito</title>
<style>
  :root{ --canopy:#1f4034; --latex:#f6f3ea; --amber:#b9791b; --slate:#2b3440; --muted:#78857c; --line:#e7e2d5; --clay:#b5432b; }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--latex);color:var(--slate);
       font-family:"Inter",system-ui,-apple-system,sans-serif;padding:24px;}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px;
       box-shadow:0 1px 2px rgba(43,52,64,.05);}

  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;
        font-family:inherit;color:var(--slate);background:#fbf9f3;}
  input:focus{outline:none;border-color:var(--amber);}
  button{width:100%;margin-top:14px;padding:10px;border:1px solid var(--canopy);background:var(--canopy);color:#fff;
         border-radius:9px;font-size:14px;font-family:inherit;font-weight:500;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  .msg{margin-top:12px;font-size:12px;min-height:16px;color:var(--clay);}
  .msg.busy{color:var(--muted);}
</style>

<script>
(function () {
  var data = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('f');
  var pass = document.getElementById('p');
  var btn  = document.getElementById('b');
  var msg  = document.getElementById('m');

  function b64(s) {
    var raw = atob(s), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function say(text, busy) {
    msg.textContent = text;
    msg.className = busy ? 'msg busy' : 'msg';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) {
      say('Navegador sem suporte a criptografia (requer HTTPS).');
      return;
    }
    btn.disabled = true;
    say('Verificando…', true);

    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pass.value), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64(data.salt), iterations: data.iter, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(data.iv) }, key, b64(data.ct));
      })
      .then(function (buf) {
        var html = new TextDecoder().decode(buf);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        btn.disabled = false;
        say('Senha incorreta.');
        pass.value = '';
        pass.focus();
      });
  });
})();
</script>
